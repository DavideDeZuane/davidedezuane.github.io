baseURL = 'https://davidedezuane.github.io'
languageCode = 'en-us'
title = 'Portfolio'
theme = "minimal-black"

# Enable search index generation and web app manifest
[outputs]
  home = ["HTML", "RSS", "JSON", "WebAppManifest"]

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"
  baseName = "manifest"
  isPlainText = true
  notAlternative = true

[params]
  brand = "Portfolio"
  description = "A minimal, dark-mode first personal site, or whatever else you want it to be about"

  # Favicon - Place your favicon files in /static/ directory
  # Supported formats: .ico, .png, .svg
  favicon = "icons/favicon.svg"
  appleTouchIcon = "apple-touch-icon.png"

  # Logo (optional)
  logo = ""

  # Project and blog intro text
  projectsIntro = "Selected projects to display list." # Can be empty
  blogIntro = "" # Can be empty

  # Web App Manifest Configuration (PWA support)
  [params.manifest]
    themeColor = "#a855f7"
    backgroundColor = "#000000"
    categories = ["blog", "portfolio", "developer"]

    # Custom icon configuration (optional)
    # If not specified, defaults to /icons/android-chrome-*.png
    # [[params.manifest.icons]]
    #   src = "/icons/android-chrome-192x192.png"
    #   sizes = "192x192"
    #   type = "image/png"
    #   purpose = "any maskable"

  # Theme Configuration
  [params.theme]
    defaultTheme = "dark"  # Options: "light", "dark", "system"

  # Home Page Configuration
  [params.home]
    sections = ["hero", "now", "tech-marquee", "projects", "posts"]
    showNowSection = true
    showFeaturedProjects = true
    showLatestPosts = true
    featuredProjectsLimit = 3
    latestPostsLimit = 3
    projectsTitle = "Selected Work"
    projectsSubtitle = ""
    blogTitle = "Latest Writing"
    blogSubtitle = ""
    techMarqueeLabel = "Experienced In"

    # Technology Stack Display
    [[params.home.tech]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.home.tech]]
      label = "Spring"
      icon = "devicon-spring-plain"  

    [[params.home.tech]]
      label = "Debian"
      icon = "devicon-debian-plain"

    [[params.home.tech]]
      label = "GitLab"
      icon = "devicon-gitlab-plain"

    [[params.home.tech]]
      label = "Docker"
      icon = "devicon-docker-plain"

    [[params.home.techReverse]]
      label = "Git"
      icon = "devicon-git-plain"

    [[params.home.techReverse]]
      label = "Hugo"
      icon = "devicon-hugo-plain"  

    [[params.home.techReverse]]
      label = "Json"
      icon = "devicon-json-plain" 

    [[params.home.techReverse]]
      label = "Linux"
      icon = "devicon-linux-plain"          

    [[params.home.techReverse]]
      label = "Markdown"
      icon = "devicon-markdown-original"  

    [[params.home.techReverse]]
      label = "Traefik"
      icon = "devicon-traefikproxy-plain" 

    [[params.home.techReverse]]
      label = "pfSense"
      icon = "devicon-pfsense-plain"       

  # About Page Alternative Layout Configuration - Optional
  [params.about.alt]
    # Stats displayed in the profile card sidebar
    [[params.about.alt.stats]]
      value = "5+"
      label = "Years Coding"

    [[params.about.alt.stats]]
      value = "20+"
      label = "Projects"

    [[params.about.alt.stats]]
      value = "∞"
      label = "Hours Spent"

    # Skills/Tech Stack badges with icons
    [[params.about.alt.skills]]
      label = "JavaScript"
      icon = "devicon-javascript-plain"

    [[params.about.alt.skills]]
      label = "Python"
      icon = "devicon-python-plain"

    [[params.about.alt.skills]]
      label = "React"
      icon = "devicon-react-original"

    [[params.about.alt.skills]]
      label = "Docker"
      icon = "devicon-docker-plain"

    [[params.about.alt.skills]]
      label = "PostgreSQL"
      icon = "devicon-postgresql-plain"

    [[params.about.alt.skills]]
      label = "AWS"
      icon = "devicon-amazonwebservices-plain"

  # Hero Section Configuration
  [params.hero]
    #badge = "PhD Student"
    title = "Hi, I'm Davide De Zuane."
    role = ""
    summary = "PhD Candidate in Cybersecurity @ IMT Lucca"
    #avatar = "images/puck.jpeg"  # Optional: 400x400px recommended
    location = "Ancona, Italy"
    # focus = "Currently focused on Hugo themes & developer experience."
    available = false
    availableLabel = ""

    nowLabel = "Quick Facts"
    nowIntro = "Right now I'm mainly:"
    now = [
      "Building minimal Hugo themes",
      "Exploring dark-mode design patterns",
      "Writing about web performance"
    ]

  # Icon Libraries
  [params.icons]
    useFontAwesome = true
    useDevicon = true

  ############################################################################################################
  # SOCIAL 
  ############################################################################################################
  [[params.hero.socials]]
    label = "GitHub"
    url = "https://github.com/DavideDeZuane"
    icon = "fa-brands fa-github"
 
  [[params.hero.socials]]
    label = "Google Scholar"
    url = "https://scholar.google.com/citations?user=_nMDRMMAAAAJ&hl=en"
    icon = "fa-brands fa-google-scholar"
 
  [[params.hero.socials]]
    label = "ORCID"
    url = "https://orcid.org/0009-0004-3379-0704"
    icon = "fa-brands fa-orcid" # non usata, l'icona ORCID è SVG inline nel partial

############################################################################################################
# NAVIGATION MENU
############################################################################################################
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    url = "/"
    weight = 1
    identifier = "home"
    [menu.main.params]
      icon = "fa-solid fa-house"

  [[menu.main]]
    name = "Research"
    pageRef = "research"
    url = "/research/"
    weight = 2
    identifier = "research"
    [menu.main.params]
      icon = "fa-solid fa-book-open"

  [[menu.main]]
    name = "CV"
    pageRef = "cv"
    url = "/projects/"
    weight = 3
    identifier = "cv"
    [menu.main.params]
      icon = "fa-regular fa-folder-open"

  [[menu.main]]
    name = "Blog"
    pageRef = "blog"
    url = "/blog/"
    weight = 4
    identifier = "blog"
    [menu.main.params]
      icon = "fa-regular fa-note-sticky"

# Markup Configuration
[markup]
  # Table of Contents
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

  # Goldmark Renderer (Markdown)
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true

  [markup.goldmark.extensions]
    typographer = true
    linkify = true
    table = true
    strikethrough = true
    taskList = true
    definitionList = true
    footnote = true

    [markup.goldmark.extensions.extras.delete]
      enable = true
    [markup.goldmark.extensions.extras.insert]
      enable = true
    [markup.goldmark.extensions.extras.mark]
      enable = true

  # Syntax Highlighting
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Privacy Configuration
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
